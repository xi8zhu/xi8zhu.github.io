<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">长期价值建模流程</title>
  <desc id="desc">问题定义、数据与表征、模型训练、长期价值评估组成闭环</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f8f7ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#20324a" flood-opacity=".09"/>
    </filter>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <text x="72" y="82" font-family="system-ui, sans-serif" font-size="31" font-weight="700" fill="#1d2939">长期价值建模：从问题到反馈闭环</text>
  <text x="72" y="120" font-family="system-ui, sans-serif" font-size="18" fill="#667085">A restrained research workflow for recommendation and sequential decision making</text>
  <g fill="none" stroke="#718096" stroke-width="3" marker-end="url(#arrow)">
    <path d="M288 285 H382"/>
    <path d="M582 285 H676"/>
    <path d="M876 285 H970"/>
    <path d="M1070 365 C1070 485 174 485 174 365"/>
  </g>
  <g filter="url(#shadow)" font-family="system-ui, sans-serif">
    <g transform="translate(74 205)">
      <rect width="214" height="160" rx="18" fill="#fff" stroke="#d0d9e6"/>
      <circle cx="38" cy="42" r="16" fill="#e8f1ff"/>
      <text x="38" y="48" text-anchor="middle" font-size="17" font-weight="700" fill="#2f6feb">1</text>
      <text x="24" y="87" font-size="23" font-weight="700" fill="#1d2939">问题定义</text>
      <text x="24" y="120" font-size="16" fill="#667085">目标、约束与评价指标</text>
    </g>
    <g transform="translate(382 205)">
      <rect width="200" height="160" rx="18" fill="#fff" stroke="#d0d9e6"/>
      <circle cx="38" cy="42" r="16" fill="#eef9f2"/>
      <text x="38" y="48" text-anchor="middle" font-size="17" font-weight="700" fill="#238636">2</text>
      <text x="24" y="87" font-size="23" font-weight="700" fill="#1d2939">数据与表征</text>
      <text x="24" y="120" font-size="16" fill="#667085">用户、物品与上下文</text>
    </g>
    <g transform="translate(676 205)">
      <rect width="200" height="160" rx="18" fill="#fff" stroke="#d0d9e6"/>
      <circle cx="38" cy="42" r="16" fill="#fff4e5"/>
      <text x="38" y="48" text-anchor="middle" font-size="17" font-weight="700" fill="#b15c00">3</text>
      <text x="24" y="87" font-size="23" font-weight="700" fill="#1d2939">模型训练</text>
      <text x="24" y="120" font-size="16" fill="#667085">预测、策略与优化</text>
    </g>
    <g transform="translate(970 205)">
      <rect width="156" height="160" rx="18" fill="#fff" stroke="#d0d9e6"/>
      <circle cx="38" cy="42" r="16" fill="#f3edff"/>
      <text x="38" y="48" text-anchor="middle" font-size="17" font-weight="700" fill="#8250df">4</text>
      <text x="24" y="87" font-size="23" font-weight="700" fill="#1d2939">长期评估</text>
      <text x="24" y="120" font-size="16" fill="#667085">反馈与迭代</text>
